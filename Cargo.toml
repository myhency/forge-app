[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# A development run reads every transcript on start (sidebar titles, usage numbers): the libraries that do the
# parsing and the reading are built optimised even in a debug build, which makes that 3 to 9 times faster.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.forge-adapter-claude-fs]
opt-level = 3
