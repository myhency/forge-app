[package]
name = "forge-adapter-report"
version.workspace = true
edition.workspace = true

[dependencies]
forge-log = { path = "../forge-log" }
forge-ports = { path = "../forge-ports" }
async-trait = "0.1"
regex = "1"
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
