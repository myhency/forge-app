[package]
name = "forge-ports"
version.workspace = true
edition.workspace = true

[dependencies]
forge-domain = { path = "../forge-domain" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
mockall = { version = "0.13", optional = true }

[dev-dependencies]
mockall = "0.13"
tokio = { version = "1", features = ["macros", "rt"] }

[features]
mocks = ["dep:mockall"]
